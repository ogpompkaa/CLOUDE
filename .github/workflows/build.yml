name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build i testy
        run: mvn -B clean verify
      - name: Upload pluginu (Paper)
        uses: actions/upload-artifact@v4
        with:
          name: UltraHC-paper
          path: ultrahc-paper/target/UltraHC-*.jar
          if-no-files-found: error
      - name: Upload pluginu (Velocity)
        uses: actions/upload-artifact@v4
        with:
          name: UltraHC-velocity
          path: ultrahc-velocity/target/UltraHC-Velocity-*.jar
          if-no-files-found: warn
