# Arena UltraHC — serwer Paper za proxy Velocity.
# Skopiuj dla kazdej areny, zmieniajac tylko server-port (30101, 30102, ...).
# online-mode=false, bo autoryzacje robi proxy (modern forwarding).
server-port=30101
online-mode=false
motd=UltraHC Arena
max-players=200
view-distance=8
simulation-distance=6
spawn-protection=0
allow-nether=false
allow-end=false
enable-command-block=false
network-compression-threshold=256
