# =====================================================================
#  Velocity — przykladowa konfiguracja proxy dla sieci UltraHC
#  Skopiuj do katalogu Velocity jako velocity.toml i dostosuj adresy/porty.
#  Dokumentacja: https://docs.papermc.io/velocity
# =====================================================================

config-version = "2.7"

# Adres, na ktorym nasluchuje proxy (to tu laczy sie gracz: port 25565).
bind = "0.0.0.0:25565"

motd = "<gold>UltraHC</gold> <gray>— siec UHC</gray>"
show-max-players = 1000
online-mode = true

# WAZNE: modern forwarding = najbezpieczniejszy tryb. Ten sam sekret musi
# byc wpisany po stronie kazdego serwera Paper (config/paper-global.yml).
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"

announce-forge = false
kick-existing-players = false

[servers]
# Nazwy logiczne serwerow -> ich adresy. Areny moga byc na roznych maszynach.
lobby   = "127.0.0.1:30065"
arena-1 = "127.0.0.1:30101"
arena-2 = "127.0.0.1:30102"
arena-3 = "127.0.0.1:30103"

# Gracz po zalogowaniu trafia najpierw na lobby (kolejno, jesli pierwszy padnie).
try = ["lobby"]

[forced-hosts]
# opcjonalne: domena -> serwer

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = 3000
connection-timeout = 5000
read-timeout = 30000
tcp-fast-open = false
proxy-protocol = false

[query]
enabled = false
port = 25565
