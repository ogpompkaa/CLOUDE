<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6ead8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mój Pies">
<title>Mój Pies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="booting">
  <header class="topbar">
    <div class="dog-id">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div class="dog-id-text">
        <div class="dog-name" id="dog-name">Piesek</div>
        <div class="level-row">
          <span class="lvl" id="lvl">Poz. 1</span>
          <div class="xpbar" role="progressbar" aria-label="Doświadczenie"><i id="xp-fill"></i></div>
        </div>
      </div>
    </div>
    <div class="top-stats">
      <div class="chip chip-bond" title="Więź"><span class="ico" data-icon="heart"></span><span id="bond-name">—</span></div>
      <div class="chip chip-coins" title="Monety"><span class="ico" data-icon="coin"></span><span id="coins">0</span></div>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <canvas id="scene" aria-label="Pies – dotknij, żeby pogłaskać"></canvas>
      <div class="stage-top">
        <div class="status-pill"><span class="dot"></span><b id="status-name">Piesek</b><span id="status">…</span></div>
        <button class="round-btn" id="btn-light" aria-label="Światło"><span class="ico" data-icon="bulb"></span></button>
      </div>
      <div class="walk-hud hidden" id="walk-hud">
        <div class="walk-progress"><span class="ico" data-icon="leash"></span><div class="bar"><i id="walk-fill"></i></div></div>
        <button class="pill-btn" id="btn-walk-home"><span class="ico" data-icon="home"></span>Wróć do domu</button>
      </div>
      <div class="studio-hud hidden" id="studio-hud">
        <span class="ico" data-icon="palette"></span>
        <span>Studio wyglądu: <b id="studio-state">idle</b></span>
        <button class="pill-btn small" id="btn-studio-close">Zakończ podgląd</button>
      </div>
      <div class="tap-hint" id="tap-hint">Dotknij psa, żeby go pogłaskać</div>
      <div class="loading" id="loading"><div class="spinner"></div>Wczytywanie pieska…</div>
    </section>

    <aside class="panel">
      <section class="needs" id="needs" aria-label="Potrzeby"></section>
      <section class="actions" id="actions" aria-label="Opieka"></section>
      <nav class="tabbar" id="tabbar" aria-label="Menu"></nav>
    </aside>
  </main>
</div>

<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-card">
    <header class="sheet-head">
      <h2 id="sheet-title">Panel</h2>
      <button class="round-btn" data-close aria-label="Zamknij"><span class="ico" data-icon="close"></span></button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="modal hidden" id="name-modal" role="dialog" aria-modal="true" aria-labelledby="name-title">
  <div class="modal-card">
    <canvas id="name-preview" width="320" height="220" aria-hidden="true"></canvas>
    <h2 id="name-title">Poznaj swojego psa!</h2>
    <p>Jak ma na imię?</p>
    <form id="name-form">
      <input id="name-input" maxlength="16" autocomplete="off" placeholder="np. Burek" required>
      <button type="submit" class="cta">Zaczynamy</button>
    </form>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- rdzeń -->
<script src="js/core/util.js"></script>
<!-- kontrakt psa i logika (bez wiedzy o grafikach) -->
<script src="js/dog/states.js"></script>
<script src="js/dog/body.js"></script>
<script src="js/dog/tasks.js"></script>
<script src="js/dog/brain.js"></script>
<script src="js/game/data.js"></script>
<script src="js/game/save.js"></script>
<script src="js/game/game.js"></script>
<!-- warstwa wyglądu (skórki) -->
<script src="js/render/skins.js"></script>
<script src="js/render/animations.js"></script>
<script src="js/render/animator.js"></script>
<script src="js/render/rig-renderer.js"></script>
<script src="js/render/frames-renderer.js"></script>
<script src="js/render/item-art.js"></script>
<script src="js/render/dog-view.js"></script>
<script src="js/render/scene.js"></script>
<!-- lista skórek -->
<script src="assets/skins/manifest.js"></script>
<!-- interfejs -->
<script src="js/ui/icons.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
