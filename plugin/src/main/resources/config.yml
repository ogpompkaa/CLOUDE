# ┌────────────────────────────────────────────────────────────┐
# │  CoreKit — configuration                                     │
# │  Do not remove `config-version`; it drives upgrade warnings. │
# └────────────────────────────────────────────────────────────┘
config-version: 1

settings:
  # Language file to load from the lang/ folder (e.g. "en", "pl").
  language: en
  # Verbose logging for troubleshooting.
  debug: false

storage:
  # SQLite database file, relative to the plugin data folder.
  file: data.db
  # Connection pool size. SQLite serialises writes, so a small pool is ideal;
  # WAL mode (enabled automatically) lets reads run concurrently.
  pool-size: 4

homes:
  # Fallback home limit for players without a `corekit.homes.limit.<n>` node.
  # Grant e.g. corekit.homes.limit.5 for VIPs, or corekit.homes.unlimited.
  default-limit: 1
