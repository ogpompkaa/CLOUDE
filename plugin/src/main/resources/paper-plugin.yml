name: CoreKit
version: '${version}'
main: pl.corekit.CoreKitPlugin
bootstrapper: pl.corekit.bootstrap.CoreKitBootstrap
api-version: '${apiVersion}'
description: Production-grade foundation for Paper plugins.
website: https://github.com/ogpompkaa/cloude
authors:
  - Igor

# Commands are registered programmatically via Brigadier (see CommandRegistrar);
# paper-plugin.yml intentionally has no `commands` block.

permissions:
  corekit.command:
    description: Access to the base /corekit command.
    default: true
  corekit.command.reload:
    description: Reload CoreKit configuration and language files.
    default: op

  # Player utilities — self by default, `.others` gates targeting someone else.
  corekit.heal:
    default: op
  corekit.heal.others:
    default: op
  corekit.feed:
    default: op
  corekit.feed.others:
    default: op
  corekit.fly:
    default: op
  corekit.fly.others:
    default: op
  corekit.god:
    default: op
  corekit.god.others:
    default: op
  corekit.gamemode:
    default: op
  corekit.gamemode.others:
    default: op

  # Homes — everyone may use them; limits come from corekit.homes.limit.<n>.
  corekit.home:
    description: Use /sethome, /home, /delhome, /homes.
    default: true
  corekit.homes.unlimited:
    description: Bypass the configured home limit.
    default: op

  # Spawn.
  corekit.spawn:
    default: true
  corekit.setspawn:
    default: op

  # Teleport requests and /back.
  corekit.tpa:
    description: Use /tpa, /tpaccept and /tpdeny.
    default: true
  corekit.tpahere:
    description: Use /tpahere.
    default: true
  corekit.back:
    description: Use /back.
    default: true

  # Teleport flow — skip the warm-up countdown and/or the cooldown.
  corekit.teleport.bypass-warmup:
    description: Teleport instantly, skipping the warm-up.
    default: op
  corekit.teleport.bypass-cooldown:
    description: Teleport without waiting for the cooldown.
    default: op
